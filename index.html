display:block;margin-bottom:4px}.notif p{font-size:13px;color:#686c76;margin:4px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.toast{position:fixed;right:22px;bottom:22px;background:#24242b;color:white;padding:13px 18px;border-radius:11px;z-index:30;box-shadow:0 12px 30px #0003}.hint{font-size:12px;color:#7c808a}.auth{max-width:450px;margin:8vh auto;background:#fff;border-radius:18px;padding:30px;box-shadow:0 20px 50px #0002}.auth h1{margin-top:0}.weeklist{display:grid;gap:10px;margin-top:15px}.weekrow{display:grid;grid-template-columns:95px 1fr;gap:10px;border-bottom:1px solid #eee;padding:10px 0}.weekrow>div:last-child{display:grid;gap:5px}.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:15px;font-size:11px;color:#757983}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}.setting{background:#fff;padding:15px;border:1px solid #e7e7ea;border-radius:12px;margin-top:10px}.setting h3{margin:0 0 6px}.setting p{margin:0;color:#777;font-size:13px}@media(max-width:850px){.app{grid-template-columns:1fr;margin:0;border:0;border-radius:0}.side{padding:12px}.brand{margin-bottom:10px}.profile,.mini,.side-label{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px 12px}.main{padding:19px 12px}.stats{grid-template-columns:repeat(2,1fr)}.day{min-height:95px;padding:4px 2px}.event{font-size:9px;padding:5px 3px}.daynum{font-size:11px}.surface{padding:12px}.formgrid{grid-template-columns:1fr}.top h1{font-size:26px}}@media(max-width:420px){.day{min-height:80px}.event{font-size:0;height:11px;padding:0}.event small{display:none}.weekhead span{font-size:10px}.stat{padding:12px}.task{grid-template-columns:4px minmax(0,1fr)}.task .pill{grid-column:2;justify-self:start}}
</style></head><body><div id="auth" class="auth hidden"><h1>Team Task Tracker <small>v1.0</small></h1><p class="hint">Sign in with your Firebase account.</p><form id="authForm"><label class="field">Email<input id="email" type="email" required autocomplete="email"></label><label class="field">Password<input id="password" type="password" required minlength="6" autocomplete="current-password"></label><button class="btn primary" type="submit">Sign in</button></form><p id="authError" class="hint"></p></div><div id="app" class="app"><aside class="side"><div class="brand"><b>✳</b> Team Tracker <span class="version">v1.0</span></div><div class="profile"><div class="avatar" id="initials">JS</div><div><strong id="username">Jordan Smith</strong><div class="muted" id="rolelabel">Manager · Preview</div><select id="userSwitch" aria-label="Preview as user"></select></div></div><nav class="nav" id="nav"><button data-page="calendar" class="active">▦ &nbsp; Calendar</button><button data-page="tasks">☷ &nbsp; My Tasks</button><button data-page="team" class="manager">♙ &nbsp; Team Tasks</button><button data-page="requests">♧ &nbsp; Requests <span class="badge" id="requestBadge">0</span></button><button data-page="approvals" class="manager">✓ &nbsp; Approvals</button><button data-page="notifications">♧ &nbsp; Notifications <span class="badge" id="notifBadge">0</span></button><button data-page="members" class="manager">♧ &nbsp; Team Members</button><button data-page="settings">⚙ &nbsp; Settings</button></nav><div class="mini"><header><strong id="miniTitle"></strong><span>◀ &nbsp; ▶</span></header><div class="mini-grid" id="miniGrid"></div></div><div class="side-label">Workspace</div><div class="muted" style="padding:0 8px">● <span id="modeLabel">Interactive demo · local only</span></div></aside><main class="main"><div class="top"><div><div class="eyebrow">YOUR TEAM WORKSPACE</div><h1 id="pageTitle">Team calendar</h1><div class="hint" id="subtitle">Keep your deadlines and team in sync.</d <script type="module">

import {firebaseConfig} from './firebase-config.js';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=new Date(), iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'), add=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return iso(x)}, now=iso(today);
const usersDemo=[{id:'u1',name:'Jordan Smith',role:'manager'},{id:'u2',name:'Sarah Lee',role:'member'},{id:'u3',name:'Michael Chen',role:'member'},{id:'u4',name:'Jessica Park',role:'member'}];
const seed=[{id:'t1',title:'Christmas campaign artwork',description:'Prepare the festive campaign visuals.',start:add(now,-1),deadline:add(now,4),ownerId:'u2',createdBy:'u1',category:'Design',priority:'High',status:'In Progress',collaborators:['u4']},{id:'t2',title:'Social media content calendar',description:'Plan next week’s content.',start:now,deadline:add(now,6),ownerId:'u3',createdBy:'u1',category:'Marketing',priority:'Medium',status:'Pending',collaborators:[]},{id:'t3',title:'Menu layout refresh',description:'Update the menu layout for review.',start:add(now,-3),deadline:add(now,1),ownerId:'u4',createdBy:'u4',category:'Design',priority:'High',status:'For Approval',collaborators:[]},{id:'t4',title:'Weekly operations review',description:'Compile weekly notes.',start:add(now,2),deadline:add(now,8),ownerId:'u1',createdBy:'u1',category:'Operations',priority:'Low',status:'Pending',collaborators:[]}];

let db=null,auth=null,unsubs=[],api=null;
const me=()=>state.users.find(u=>u.id===state.userId), manager=()=>me()?.role==='manager', name=id=>state.users.find(u=>u.id===id)?.name||'Unknown', visible=t=>manager()||t.ownerId===state.userId||t.createdBy===state.userId||t.collaborators.includes(state.userId), tasks=()=>state.tasks.filter(visible), fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}), toast=m=>{$('#toast').textContent=m;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),3200)};
const notify=(id,text)=>{state.notifications.unshift({id:crypto.randomUUID(),toId:id,text,read:false});persist('notifications',state.notifications[0]);};
function persist(col,obj){if(!state.firebase)return;api.setDoc(api.doc(db,col,obj.id),obj).catch(e=>toast('Save failed: '+e.message))}
function updateTask(t){let i=state.tasks.findIndex(x=>x.id===t.id);if(i>=0)state.tasks[i]=t;else state.tasks.push(t);persist('tasks',t);render()}
function initFirebase(){if(!firebaseConfig?.apiKey||firebaseConfig.apiKey.includes('REPLACE'))return;import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js').then(async a=>{let [au,fs]=await Promise.all([import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js')]);api={...au,...fs};const app=a.initializeApp(firebaseConfig);auth=au.getAuth(app);db=fs.getFirestore(app);$('#app').classList.add('hidden');$('#auth').classList.remove('hidden');au.onAuthStateChanged(auth,async u=>{unsubs.forEach(f=>f());unsubs=[];if(!u){$('#auth').classList.remove('hidden');$('#app').classList.add('hidden');return}state.firebase=true;state.userId=u.uid;$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');$('#modeLabel').textContent='Firebase · live sync';$('#userSwitch').classList.add('hidden');const collections=['users','tasks','requests','notifications'];collections.forEach(c=>{unsubs.push(fs.onSnapshot(fs.collection(db,c),snap=>{state[c]=snap.docs.map(d=>({id:d.id,...d.data()}));render()},err=>toast('Firebase access: '+err.message)))});render()})}).catch(e=>toast('Firebase setup failed: '+e.message))}
$('#authForm').addEventListener('submit',async e=>{e.preventDefault();try{await api.signInWithEmailAndPassword(auth,$('#email').value,$('#password').value);$('#authError').textContent=''}catch(err){$('#authError').textContent=err.message}});
function render(){if(!me()){if(state.firebase){$('#content').innerHTML='<div class="empty">Your account is not provisioned. Ask a manager to add your user profile.</div>';return}return}$('#username').textContent=me().name;$('#initials').textContent=me().name.split(' ').map(x=>x[0]).join('').slice(0,2);$('#rolelabel').textContent=(manager()?'Manager':'Team member')+(state.firebase?' · Live':' · Preview');$('#userSwitch').innerHTML=state.users.map(u=>`<option value="${esc(u.id)}" ${u.id===state.userId?'selected':''}>${esc(u.name)}</option>`).join('');document.querySelectorAll('.manager').forEach(x=>x.classList.toggle('hidden',!manager()));document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===state.page));const nr=state.notifications.filter(n=>n.toId===state.userId&&!n.read).length,rr=state.requests.filter(r=>r.toId===state.userId&&r.status==='pending').length;$('#notifBadge').textContent=nr;$('#bellCount').textContent=nr;$('#requestBadge').textContent=rr;let all=tasks();$('#stats').innerHTML=[['My visible tasks',all.length],['In progress',all.filter(t=>t.status==='In Progress').length],['For approval',all.filter(t=>t.status==='For Approval').length],['Overdue',all.filter(t=>t.deadline<now&&t.status!=='Completed').length]].map(([label,v])=>`<div class="stat"><span>${label}</span><strong>${v}</strong></div>`).join('');let titles={calendar:'Team calendar',tasks:'My tasks',team:'Team tasks',requests:'Collaboration requests',approvals:'Approval queue',notifications:'Notifications',members:'Team members',settings:'Settings'};$('#pageTitle').textContent=titles[state.page];$('#todayBtn').classList.toggle('hidden',state.page!=='calendar');$('#prevBtn').classList.toggle('hidden',state.page!=='calendar');$('#nextBtn').classList.toggle('hidden',state.page!=='calendar');$('#newBtn').classList.toggle('hidden',state.page==='settings'||state.page==='members');$('#miniTitle').textContent=state.date.toLocaleDateString('en-US',{month:'long',year:'numeric'});drawMini();const c=$('#content');if(state.page==='calendar')drawCalendar(c);else if(state.page==='tasks')drawTasks(c,all.filter(t=>t.ownerId===state.userId||t.createdBy===state.userId||t.collaborators.includes(state.userId)));else if(state.page==='team'&&manager())drawTasks(c,state.tasks);else if(state.page==='approvals'&&manager())drawTasks(c,state.tasks.filter(t=>t.status==='For Approval'));else if(state.page==='requests')drawRequests(c);else if(state.page==='notifications')drawNotifications(c);else if(state.page==='members'&&manager())drawMembers(c);else if(state.page==='settings')drawSettings(c);else state.page='calendar';}
function drawMini(){let d=new Date(state.date.getFullYear(),state.date.getMonth(),1),offset=(d.getDay()+6)%7,days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();$('#miniGrid').innerHTML=['M','T','W','T','F','S','S'].map(x=>`<span>${x}</span>`).join('')+Array.from({length:offset},()=>'<span></span>').join('')+Array.from({length:days},(_,i)=>`<span class="${iso(new Date(d.getFullYear(),d.getMonth(),i+1))===now?'today':''}">${i+1}</span>`).join('')}
function eventHtml(t){let overdue=t.deadline<now&&t.status!=='Completed',cat=t.status==='Completed'?'completed':t.category.toLowerCase();return `<button class="event ${cat} ${overdue?'overdue':''}" data-task="${esc(t.id)}" title="${esc(t.title)}">${esc(t.title)}<small>${esc(name(t.ownerId).split(' ')[0])}</small></button>`}
function drawCalendar(c){let d=state.date,y=d.getFullYear(),m=d.getMonth();c.innerHTML=`<div class="row"><h2>${d.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h2><div class="switch">${['Month','Week','Day'].map(v=>`<button data-view="${v}" class="${state.view===v?'active':''}">${v}</button>`).join('')}</div></div><div id="calendarBody"></div><div class="legend"><span><i style="background:#d9cafa"></i>Design</span><span><i style="background:#d6ebf4"></i>Marketing</span><span><i style="background:#fce5c8"></i>Operations</span><span><i style="background:#d9f2dc"></i>Completed</span><span>🔴 Overdue outline</span></div>`;let target=$('#calendarBody');if(state.view==='Month'){let first=new Date(y,m,1),offset=(first.getDay()+6)%7,last=new Date(y,m+1,0).getDate(),cells=Math.ceil((offset+last)/7)*7;target.innerHTML='<div class="calendar"><div class="weekhead">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<span>${x}</span>`).join('')+'</div><div class="monthgrid">'+Array.from({length:cells},(_,i)=>{let date=iso(new Date(y,m,i-offset+1)),other=i<offset||i>=offset+last;return `<div class="day ${other?'other':''} ${date===now?'today':''}"><span class="daynum">${Number(date.slice(-2))}</span>${tasks().filter(t=>t.start<=date&&t.deadline>=date).slice(0,3).map(eventHtml).join('')}</div>`}).join('')+'</div></div>'}else{let anchor=state.view==='Day'?iso(new Date(y,m,Math.min(today.getDate(),new Date(y,m+1,0).getDate()))):iso(new Date(y,m,Math.min(today.getDate(),new Date(y,m+1,0).getDate()))),base=new Date(anchor+'T12:00:00'),days=state.view==='Day'?[anchor]:Array.from({length:7},(_,i)=>add(anchor,i-(base.getDay()+6)%7));target.innerHTML='<div class="weeklist">'+days.map(date=>`<div class="weekrow"><strong>${new Date(date+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</strong><div>${tasks().filter(t=>t.start<=date&&t.deadline>=date).map(eventHtml).join('')||'<span class="hint">No tasks</span>'}</div></div>`).join('')+'</d function drawRequests(c){let arr=state.requests.filter(r=>r.toId===state.userId||r.fromId===state.userId);c.innerHTML=`<div class="row"><h2>Collaboration invitations</h2></div><div class="list">${arr.map(r=>{let t=state.tasks.find(t=>t.id===r.taskId);return `<div class="task"><div class="stripe"></div><div><strong>${esc(t?.title||'Task unavailable')}</strong><p>${esc(name(r.fromId))} invited ${esc(name(r.toId))} · ${esc(r.status)}</p></div><div>${r.toId===state.userId&&r.status==='pending'?`<button class="btn primary" data-request="${r.id}" data-response="accepted">Accept</button> <button class="btn" data-request="${r.id}" data-response="declined">Decline</button>`:''}</div></div>`}).join('')||'<div class="empty">No collaboration requests.</div>'}</div>`}
function drawNotifications(c){let list=state.notifications.filter(n=>n.toId===state.userId);c.innerHTML=`<div class="row"><h2>Activity updates</h2><button class="btn" id="markAll">Mark all read</button></div><div style="margin-top:16px">${list.map(n=>`<div class="notif ${n.read?'':'unread'}"><strong>${n.read?'Update':'● New notification'}</strong><p>${esc(n.text)}</p><button class="btn" data-read="${n.id}" ${n.read?'disabled':''}>Mark read</button></div>`).join('')||'<div class="empty">You are all caught up.</div>'}</div>`}
function drawMembers(c){c.innerHTML=`<div class="row"><h2>People & permissions</h2><span class="hint">Manager-only</span></div><div class="notice">Role changes in Firebase require a trusted server-side role management endpoint. They are disabled in live mode until configured.</div><div class="list">${state.users.map(u=>`<div class="task"><div class="stripe"></div><div><strong>${esc(u.name)}</strong><p>${u.role==='manager'?'👑 Manager':'Team member'}</p></div><button class="btn" data-role="${esc(u.id)}" ${state.firebase||u.id===state.userId||u.role==='manager'&&state.users.filter(x=>x.role==='manager').length===1?'disabled':''}>${u.role==='manager'?'Demote':'Promote'}</button></div>`).join('')}</div>`}
function drawSettings(c){c.innerHTML=`<h2>Workspace settings</h2><div class="setting"><h3>Connection</h3><p>${state.firebase?'Firebase Authentication + Cloud Firestore connected.':'Local interactive preview. Changes reset when you reload. Configure Firebase to enable shared team data.'}</p></div><div class="setting"><h3>Task attachments</h3><p>Disabled by design to keep the app lightweight.</p></div><div class="setting"><h3>Permissions</h3><p>Firebase mode requires deployed Firestore security rules and a trusted role-change service. Do not enable open user registration without an invitation/provisioning policy.</p></div>${state.firebase?'<button class="btn" id="signOut" style="margin-top:15px">Sign out</button>':''}`}
function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modalback').classList.remove('hidden')};function closeModal(){$('#modalback').classList.add('hidden')}
function taskForm(){openModal('Create a new task',`<form id="taskForm"><div class="formgrid"><label class="field wide">Task title<input name="title" required maxlength="120" placeholder="e.g. Campaign design"></label><label class="field wide">Description<textarea name="description" maxlength="3000" placeholder="Task details"></textarea></label><label class="field">Start date<input name="start" type="date" value="${now}" required></label><label class="field">Deadline<input name="deadline" type="date" value="${add(now,3)}" required></label><label class="field">Category<select name="category">${['Design','Marketing','Operations','Personal'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field">Priority<select name="priority">${['Low','Medium','High','Urgent'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field wide">Assign to<select name="ownerId">${(manager()?state.users:[me()]).map(u=>`<option value="${esc(u.id)}">${esc(u.name)}</option>`).join('')}</select></label></div><div class="footer"><button class="btn" type="button" id="cancelForm">Cancel</button><button class="btn primary">Create task</button></div></form>`)}
function taskDetails(id){let t=state.tasks.find(x=>x.id===id);if(!t||!visible(t))return;let canEdit=manager()||t.ownerId===state.userId||t.createdBy===state.userId||t.collaborators.includes(state.userId);openModal(t.title,`<p class="hint">${esc(t.description||'No description')}</p><div class="formgrid"><div class="setting"><strong>Start</strong><p>${fmt(t.start)}</p></div><div class="setting"><strong>Deadline</strong><p>${fmt(t.deadline)}</p></div><div class="setting"><strong>Owner</strong><p>${esc(name(t.ownerId))}</p></div><div class="setting"><strong>Priority</strong><p>${esc(t.priority)}</p></div></div><p class="hint">Collaborators: ${t.collaborators.map(name).map(esc).join(', ')||'None'}</p>${canEdit?`<label class="field">Task status<select id="statusChange">${['Pending','In Progress','On Hold','For Approval','Completed'].filter(s=>s!=='Completed'||manager()).map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></label><button class="btn primary" data-save-status="${esc(t.id)}">Save status</button>`:''}${manager()&&t.status==='For Approval'?` <button class="btn" data-revision="${esc(t.id)}">Request revision</button>`:''}<hr style="border:0;border-top:1px solid #eee;margin:20px 0"><label class="field">Invite a teammate<select id="inviteUser"><option value="">Choose teammate</option>${state.users.filter(u=>u.id!==state.userId&&u.id!==t.ownerId&&!t.collaborators.includes(u.id)).map(u=>`<option value="${esc(u.id)}">${esc(u.name)}</option>`).join('')}</select></label><button class="btn purple" data-invite="${esc(t.id)}">Send collaboration request</button>`)}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(!b)return;if(!manager()&&['team','approvals','members'].includes(b.dataset.page))return;state.page=b.dataset.page;render()});$('#userSwitch').addEventListener('change',e=>{if(state.firebase)return;state.userId=e.target.value;if(!manager()&&['team','approvals','members'].includes(state.page))state.page='calendar';render()});$('#todayBtn').onclick=()=>{state.date=new Date(today.getFullYear(),today.getMonth(),1);render()};$('#prevBtn').onclick=()=>{state.date=new Date(state.date.getFullYear(),state.date.getMonth()-(state.view==='Month'?1:0),state.view==='Month'?1:Math.max(1,state.date.getDate()-(state.view==='Week'?7:1)));render()};$('#nextBtn').onclick=()=>{state.date=new Date(state.date.getFullYear(),state.date.getMonth()+(state.view==='Month'?1:0),state.view==='Month'?1:state.date.getDate()+(state.view==='Week'?7:1));render()};$('#bellBtn').onclick=()=>{state.page='notifications';render()};$('#newBtn').onclick=taskForm;$('#closeModal').onclick=closeModal;$('#modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});
$('#content').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.view){state.view=b.dataset.view;render()}else if(b.dataset.task)taskDetails(b.dataset.task);else if(b.dataset.request){let r=state.requests.find(x=>x.id===b.dataset.request);if(!r||r.toId!==state.userId||r.status!=='pending')return;r.status=b.dataset.response;if(r.status==='accepted'){let t=state.tasks.find(x=>x.id===r.taskId);if(t&&!t.collaborators.includes(state.userId)){t.collaborators.push(state.userId);updateTask(t)}}persist('requests',r);notify(r.fromId,`${name(state.userId)} ${r.status} your collaboration request`);render();toast('Request '+r.status)}else if(b.dataset.read){let n=state.notifications.find(x=>x.id===b.dataset.read);if(n&&n.toId===state.userId){n.read=true;persist('notifications',n);render()}}else if(b.id==='markAll'){state.notifications.filter(n=>n.toId===state.userId&&!n.read).forEach(n=>{n.read=true;persist('notifications',n)});render()}else if(b.dataset.role){if(state.firebase)return;let u=state.users.find(x=>x.id===b.dataset.role);if(!manager()||!u||u.id===state.userId)return;if(u.role==='manager'&&state.users.filter(x=>x.role==='manager').length<2)return;u.role=u.role==='manager'?'member':'manager';notify(u.id,`Your role has changed to ${u.role}`);render()}else if(b.id==='signOut'&&auth)api.signOut(auth)});
$('#modalBody').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.id==='cancelForm'){closeModal();return}if(b.dataset.saveStatus||b.dataset.revision){let t=state.tasks.find(x=>x.id===(b.dataset.saveStatus||b.dataset.revision));if(!t)return;let status=b.dataset.revision?'In Progress':$('#statusChange').value;if(status==='Completed'&&!manager())return;if(t.status!==status){t.status=status;updateTask(t);if(status==='For Approval')state.users.filter(u=>u.role==='manager').forEach(u=>notify(u.id,`${name(state.userId)} submitted ${t.title} for approval`));if(b.dataset.revision)notify(t.ownerId,`Revision requested for ${t.title}`);if(status==='Completed')notify(t.ownerId,`${t.title} was approved`)}closeModal();toast('Task updated')}else if(b.dataset.invite){let to=$('#inviteUser').value,t=state.tasks.find(x=>x.id===b.dataset.invite);if(!to||!t)return;if(state.requests.some(r=>r.taskId===t.id&&r.toId===to&&r.status==='pending'))return toast('Invitation already pending');let r={id:crypto.randomUUID(),taskId:t.id,fromId:state.userId,toId:to,status:'pending'};state.requests.push(r);persist('requests',r);notify(to,`${name(state.userId)} invited you to collaborate on ${t.title}`);closeModal();render();toast('Invitation sent')}});
$('#modalBody').addEventListener('submit',e=>{if(e.target.id!=='taskForm')return;e.preventDefault();let f=new FormData(e.target),start=f.get('start'),deadline=f.get('deadline');if(deadline<start)return toast('Deadline must be after the start date');let ownerId=f.get('ownerId');if(!manager()&&ownerId!==state.userId)return;let t={id:crypto.randomUUID(),title:String(f.get('title')).trim(),description:String(f.get('description')).trim(),start,deadline,category:f.get('category'),priority:f.get('priority'),ownerId,createdBy:state.userId,status:'Pending',collaborators:[]};if(!t.title)return;updateTask(t);if(ownerId!==state.userId)notify(ownerId,`${name(state.userId)} assigned you: ${t.title}`);closeModal();toast('Task created')});
render();initFirebase();
</script></body></html>
