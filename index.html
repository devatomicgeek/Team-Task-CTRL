$('#authForm').addEventListener('submit',async e=>{e.preventDefault();try{await api.signInWithEmailAndPassword(auth,$('#email').value,$('#password').value);$('#authError').textContent=''}catch(err){$('#authError').textContent=err.message}});
function render(){if(!me()){if(state.firebase){$('#content').innerHTML='<div class="empty">Your account is not provisioned. Ask a manager to add your user profile.</div>';return}return}$('#username').textContent=me().name;$('#initials').textContent=me().name.split(' ').map(x=>x[0]).join('').slice(0,2);$('#rolelabel').textContent=(manager()?'Manager':'Team member')+(state.firebase?' · Live':' · Preview');$('#userSwitch').innerHTML=state.users.map(u=>`<option value="${esc(u.id)}" ${u.id===state.userId?'selected':''}>${esc(u.name)}</option>`).join('');document.querySelectorAll('.manager').forEach(x=>x.classList.toggle('hidden',!manager()));document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===state.page));const unreadChats=state.chats.reduce((n,c)=>n+Math.max(0,(c.messageCount||0)-((c.readCounts||{})[state.userId]||0)),0);$('#chatBadge').textContent=unreadChats>99?'99+':unreadChats;const rr=state.requests.filter(r=>r.toId===state.userId&&r.status==='pending').length,nr=combinedNotifications().filter(n=>n.toId===state.userId&&!n.read).length+rr;$('#notifBadge').textContent=nr;$('#bellCount').textContent=nr>9?'9+':nr;$('#bellCount').classList.toggle('hidden',nr===0);$('#requestBadge').textContent=rr;let all=tasks();$('#stats').innerHTML=[['My visible tasks',all.length],['In progress',all.filter(t=>t.status==='In Progress').length],['For approval',all.filter(t=>t.status==='For Approval').length],['Overdue',all.filter(t=>t.deadline<now&&t.status!=='Completed').length]].map(([label,v])=>`<div class="stat"><span>${label}</span><strong>${v}</strong></div>`).join('');let titles={calendar:'Team calendar',tasks:'My tasks',team:'Team tasks',requests:'Collaboration requests',approvals:'Approval queue',notifications:'Notifications',members:'Team members',settings:'Settings',chat:'Team chat',leave:'Leave planner'};$('#pageTitle').textContent=titles[state.page];$('#todayBtn').classList.toggle('hidden',state.page!=='calendar');$('#prevBtn').classList.toggle('hidden',state.page!=='calendar');$('#nextBtn').classList.toggle('hidden',state.page!=='calendar');$('#newBtn').classList.toggle('hidden',['settings','members','chat','leave'].includes(state.page));$('#miniTitle').textContent=state.date.toLocaleDateString('en-US',{month:'long',year:'numeric'});drawMini();const c=$('#content');if(state.page==='calendar')drawCalendar(c);else if(state.page==='tasks')drawTasks(c,all.filter(t=>t.ownerId===state.userId||t.createdBy===state.userId||t.collaborators.includes(state.userId)));else if(state.page==='team'&&manager())drawTasks(c,state.tasks.filter(t=>!t.deletedAt));else if(state.page==='approvals'&&manager())drawTasks(c,state.tasks.filter(t=>!t.deletedAt&&t.status==='For Approval'));else if(state.page==='requests')drawRequests(c);else if(state.page==='notifications')drawNotifications(c);else if(state.page==='members'&&manager())drawMembers(c);else if(state.page==='chat')drawChat(c);else if(state.page==='leave')drawLeave(c);else if(state.page==='settings')drawSettings(c);else state.page='calendar';}

// v1.5: shared task/leave calendar, private chat, and tentative/approved leave.
function calendarEntries(date){const result=[];if(state.calendarFilter!=='Leave')result.push(...tasks().filter(t=>t.start<=date&&t.deadline>=date).map(eventHtml));if(state.calendarFilter!=='Tasks')result.push(...state.leaves.filter(l=>l.status!=='declined'&&l.status!=='cancelled'&&l.start<=date&&l.end>=date).map(l=>`<button class="event leave-event ${l.status==='approved'?'approved':''}" data-leave-view="${esc(l.id)}" title="${esc(name(l.userId))}: ${esc(l.status)}">🏖 ${esc(name(l.userId))} · ${l.status==='approved'?'Approved':'Planned'}</button>`));return result}
function chatName(c){return c.type==='direct'?name(c.participants.find(x=>x!==state.userId)):c.type==='task'?'Task: '+(state.tasks.find(t=>t.id===c.taskId)?.title||'Task'):(c.title||'Group chat')}
function drawChat(c){const sorted=state.chats.filter(x=>x.type!=='task'||!state.tasks.some(t=>t.id===x.taskId&&t.deletedAt)).sort((a,b)=>(b.updatedAt?.seconds||0)-(a.updatedAt?.seconds||0));c.innerHTML=`<div class="row"><h2>Team chat</h2><div><button class="btn" id="startDirect">+ Direct</button> <button class="btn" id="startGroup">+ Group</button></div></div><p class="hint">Text-only messages. Task chats are accessible from their task details.</p><div class="chat-layout"><div class="chat-list">${sorted.map(x=>`<button class="btn" style="display:block;width:100%;text-align:left;margin:5px 0" data-chat-open="${esc(x.id)}">${esc(chatName(x))} <span class="badge">${Math.max(0,(x.messageCount||0)-((x.readCounts||{})[state.userId]||0))||''}</span></button>`).join('')||'<p class="hint">No conversations yet.</p>'}</div><div class="chat-pane"><h3>${esc(state.chats.find(x=>x.id===state.chatId)?chatName(state.chats.find(x=>x.id===state.chatId)):'Select a conversation')}</h3><div class="chat-messages" id="chatMessages">${state.messages.map(m=>`<div class="bubble ${m.senderId===state.userId?'mine':''}"><strong>${esc(name(m.senderId))}</strong><div>${esc(m.text)}</div><small>${m.createdAt?.toDate?m.createdAt.toDate().toLocaleString():''}</small></div>`).join('')||'<p class="hint">No messages.</p>'}</div><form id="chatSend" class="chat-compose"><input class="filter" id="chatText" maxlength="1500" placeholder="Type a message..." aria-label="Message" required ${!state.chatId?'disabled':''}><button class="btn primary" ${!state.chatId?'disabled':''}>Send</button></form></div></div>`;const box=$('#chatMessages');if(box)box.scrollTop=box.scrollHeight}
async function openChat(id){const c=state.chats.find(x=>x.id===id);if(!c||!c.participants.includes(state.userId))return;state.chatId=id;state.messages=[];if(state.chatUnsub)state.chatUnsub();if(state.firebase){state.chatUnsub=api.onSnapshot(api.query(api.collection(db,'chats',id,'messages'),api.orderBy('createdAt','desc'),api.limit(30)),snap=>{state.messages=snap.docs.map(d=>({id:d.id,...d.data()})).reverse();if(state.page==='chat')render()},e=>toast('Messages: '+e.message));if(((c.readCounts||{})[state.userId]||0)<(c.messageCount||0))await api.updateDoc(api.doc(db,'chats',id),{[`readCounts.${state.userId}`]:c.messageCount||0}).catch(e=>console.warn('Read count',e))}else state.messages=c.demoMessages||[];state.page='chat';render()}
async function startChat(type){let choices=state.users.filter(u=>u.id!==state.userId);openModal(type==='direct'?'Start direct chat':'Create group chat',`<label class="field">${type==='group'?'Group name':'Teammate'}${type==='group'?'<input id="groupTitle" maxlength="70" placeholder="Group name">':''}</label><div class="list">${choices.map(u=>`<label><input type="${type==='direct'?'radio':'checkbox'}" name="chatMember" value="${esc(u.id)}"> ${esc(u.name)}</label>`).join('')}</div><div class="footer"><button class="btn primary" id="createChat" data-chat-type="${type}">Create chat</button></div>`)}
async function createChat(type){let ids=[...document.querySelectorAll('[name="chatMember"]:checked')].map(x=>x.value);if(type==='direct'&&ids.length!==1)return toast('Select one teammate');if(type==='group'&&ids.length<1)return toast('Select group members');let title=$('#groupTitle')?.value.trim()||'';if(type==='group'&&!title)return toast('Enter a group name');const members=[state.userId,...ids].sort(),id=type==='direct'?'direct_'+members.join('_'):crypto.randomUUID();let existing=state.chats.find(x=>x.id===id);if(!existing){let c={id,type,title,participants:members,createdBy:state.userId,messageCount:0,readCounts:{},createdAt:state.firebase?api.serverTimestamp():new Date(),updatedAt:state.firebase?api.serverTimestamp():new Date()};try{if(state.firebase)await api.setDoc(api.doc(db,'chats',id),c);else state.chats.push({...c,demoMessages:[]})}catch(e){return toast('Create chat failed: '+e.message)}}closeModal();openChat(id)}
async function sendChat(){let txt=$('#chatText')?.value.trim(),c=state.chats.find(x=>x.id===state.chatId);if(!txt||!c||txt.length>1500)return;try{if(state.firebase){const msg=api.doc(api.collection(db,'chats',c.id,'messages'));await api.runTransaction(db,async tx=>{const ref=api.doc(db,'chats',c.id),snapshot=await tx.get(ref);if(!snapshot.exists())throw Error('Conversation no longer exists');const current=snapshot.data();if(!current.participants.includes(state.userId))throw Error('You are not a participant');const count=(current.messageCount||0)+1;tx.set(msg,{senderId:state.userId,text:txt,createdAt:api.serverTimestamp()});tx.update(ref,{messageCount:count,updatedAt:api.serverTimestamp(),[`readCounts.${state.userId}`]:count})})}else{c.demoMessages.push({senderId:state.userId,text:txt,createdAt:new Date()});c.messageCount++;c.readCounts[state.userId]=c.messageCount;state.messages=c.demoMessages}render()}catch(e){toast('Send failed: '+e.message)}}
async function openTaskChat(t){if(t.deletedAt)return toast('Deleted task chats are read-only');let members=[...new Set([t.ownerId,...(t.collaborators||[])])];if(!members.includes(state.userId)&&!manager())return;let id='task_'+t.id;let c=state.chats.find(x=>x.id===id);if(!c){c={id,type:'task',taskId:t.id,title:t.title,participants:members,createdBy:state.userId,messageCount:0,readCounts:{},createdAt:state.firebase?api.serverTimestamp():new Date(),updatedAt:state.firebase?api.serverTimestamp():new Date()};try{if(state.firebase)await api.setDoc(api.doc(db,'chats',id),c);else state.chats.push({...c,demoMessages:[]})}catch(e){return toast('Task chat failed: '+e.message)}}closeModal();openChat(id)}
function drawLeave(c){const mine=state.leaves.filter(l=>l.userId===state.userId),pending=state.leaves.filter(l=>l.status==='pending');c.innerHTML=`<div class="row"><h2>Team leave planner</h2><span class="hint">Yellow = planned · Green = approved</span></div><div class="notice">Planned leave is visible immediately, but only approved leave is official. Leave reasons are not collected or shared.</div><form id="leaveForm" class="formgrid" style="margin-top:18px"><label class="field">Start date<input name="start" type="date" value="${now}" required></label><label class="field">End date<input name="end" type="date" value="${now}" required></label><button class="btn primary" type="submit">Submit planned leave</button></form><h3>Team leave</h3><div class="list">${state.leaves.filter(l=>!['cancelled','declined'].includes(l.status)).sort((a,b)=>a.start.localeCompare(b.start)).map(l=>`<div class="task"><div class="stripe" style="background:${l.status==='approved'?'#79bb84':'#e4bc61'}"></div><div><strong>${esc(name(l.userId))}</strong><p>${fmt(l.start)} – ${fmt(l.end)} · ${l.status==='approved'?'Approved':'Pending approval'}</p></div>${l.userId===state.userId?`<button class="btn" data-leave-cancel="${esc(l.id)}">Cancel</button>`:''}</div>`).join('')||'<div class="empty">No planned leave.</div>'}</div>${manager()?`<h3>Manager approval queue</h3><div class="list">${pending.filter(l=>l.userId!==state.userId).map(l=>`<div class="task"><div class="stripe"></div><div><strong>${esc(name(l.userId))}</strong><p>${fmt(l.start)} – ${fmt(l.end)}${l.note?' · Note: '+esc(l.note):''}</p></div><div><button class="btn primary" data-leave-decision="${esc(l.id)}" data-decision="approved">Approve</button> <button class="btn" data-leave-decision="${esc(l.id)}" data-decision="declined">Decline</button></div></div>`).join('')||'<p class="hint">No leave requests awaiting review.</p>'}</div>`:''}<h3>My leave history</h3><p class="hint">${mine.length} leave request(s)</p>`}
async function saveLeave(form){let f=new FormData(form),start=f.get('start'),end=f.get('end');if(end<start)return toast('End date must be on or after start date');let l={id:crypto.randomUUID(),userId:state.userId,start,end,note:'',status:'pending',createdAt:state.firebase?api.serverTimestamp():new Date()};try{if(state.firebase)await api.setDoc(api.doc(db,'leaves',l.id),l);else state.leaves.push(l);render();toast('Planned leave submitted')}catch(e){toast('Leave request failed: '+e.message)}}
async function decideLeave(id,status){let l=state.leaves.find(x=>x.id===id);if(!manager()||!l||l.userId===state.userId||l.status!=='pending')return;try{if(state.firebase)await api.updateDoc(api.doc(db,'leaves',id),{status,reviewedBy:state.userId,reviewedAt:api.serverTimestamp()});else{l.status=status;l.reviewedBy=state.userId}render();toast('Leave '+status)}catch(e){toast('Approval failed: '+e.message)}}
async function cancelLeave(id){let l=state.leaves.find(x=>x.id===id);if(!l||l.userId!==state.userId)return;try{if(state.firebase)await api.updateDoc(api.doc(db,'leaves',id),{status:'cancelled'});else l.status='cancelled';render();toast('Leave cancelled')}catch(e){toast('Cancel failed: '+e.message)}}

function drawMini(){let d=new Date(state.date.getFullYear(),state.date.getMonth(),1),offset=(d.getDay()+6)%7,days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();$('#miniGrid').innerHTML=['M','T','W','T','F','S','S'].map(x=>`<span>${x}</span>`).join('')+Array.from({length:offset},()=>'<span></span>').join('')+Array.from({length:days},(_,i)=>`<span class="${iso(new Date(d.getFullYear(),d.getMonth(),i+1))===now?'today':''}">${i+1}</span>`).join('')}
function eventHtml(t){let overdue=t.deadline<now&&t.status!=='Completed',cat=t.status==='Completed'?'completed':t.category.toLowerCase();return `<button class="event ${cat} ${overdue?'overdue':''}" data-task="${esc(t.id)}" title="${esc(t.title)}">${esc(t.title)}<small>${esc(name(t.ownerId).split(' ')[0])}</small></button>`}
function drawCalendar(c){let d=state.date,y=d.getFullYear(),m=d.getMonth();c.innerHTML=`<div class="row"><h2>${d.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h2><div class="switch">${['Month','Week','Day'].map(v=>`<button data-view="${v}" class="${state.view===v?'active':''}">${v}</button>`).join('')}</div></div><select class="filter" id="calendarFilter"><option ${state.calendarFilter==='Both'?'selected':''}>Both</option><option ${state.calendarFilter==='Tasks'?'selected':''}>Tasks</option><option ${state.calendarFilter==='Leave'?'selected':''}>Leave</option></select><div id="calendarBody"></div><div class="legend"><span><i style="background:#d9cafa"></i>Design</span><span><i style="background:#d6ebf4"></i>Marketing</span><span><i style="background:#fce5c8"></i>Operations</span><span><i style="background:#d9f2dc"></i>Completed</span><span>🔴 Overdue outline</span></div>`;let target=$('#calendarBody');if(state.view==='Month'){let first=new Date(y,m,1),offset=(first.getDay()+6)%7,last=new Date(y,m+1,0).getDate(),cells=Math.ceil((offset+last)/7)*7;target.innerHTML='<div class="calendar"><div class="weekhead">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<span>${x}</span>`).join('')+'</div><div class="monthgrid">'+Array.from({length:cells},(_,i)=>{let date=iso(new Date(y,m,i-offset+1)),other=i<offset||i>=offset+last;return `<div class="day ${other?'other':''} ${date===now?'today':''}"><span class="daynum">${Number(date.slice(-2))}</span>${calendarEntries(date).slice(0,3).join('')}</div>`}).join('')+'</div></div>'}else{let anchor=state.view==='Day'?iso(new Date(y,m,Math.min(today.getDate(),new Date(y,m+1,0).getDate()))):iso(new Date(y,m,Math.min(today.getDate(),new Date(y,m+1,0).getDate()))),base=new Date(anchor+'T12:00:00'),days=state.view==='Day'?[anchor]:Array.from({length:7},(_,i)=>add(anchor,i-(base.getDay()+6)%7));target.innerHTML='<div class="weeklist">'+days.map(date=>`<div class="weekrow"><strong>${new Date(date+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</strong><div>${calendarEntries(date).join('')||'<span class="hint">No tasks</span>'}</div></div>`).join('')+'</div>'}}
function drawTasks(c,list){c.innerHTML=`<div class="row"><h2>${state.page==='approvals'?'Tasks awaiting review':'Task list'}</h2><span class="hint">${list.length} tasks</span></div><div class="list">${list.sort((a,b)=>a.deadline.localeCompare(b.deadline)).map(t=>`<div class="task"><div class="stripe"></div><div><strong>${esc(t.title)}</strong><p>${esc(name(t.ownerId))} · ${fmt(t.start)} → ${fmt(t.deadline)} · ${esc(t.priority)}</p></div><button class="btn" data-task="${esc(t.id)}">${esc(t.status)} ↗</button></div>`).join('')||'<div class="empty">No tasks to display.</div>'}</div>`}
function drawRequests(c){let arr=state.requests.filter(r=>(r.toId===state.userId||r.fromId===state.userId)&&!(r.clearedBy||[]).includes(state.userId));c.innerHTML=`<div class="row"><h2>Collaboration invitations</h2><button class="btn" id="clearAllRequests" ${arr.some(r=>r.status!=='pending')?'':'disabled'}>Clear all resolved</button></div><div class="list">${arr.map(r=>{let t=state.tasks.find(t=>t.id===r.taskId);return `<div class="task"><div class="stripe"></div><div><strong>${esc(t?.title||'Task unavailable')}</strong><p>${esc(name(r.fromId))} invited ${esc(name(r.toId))} · ${esc(r.status)}</p></div><div>${r.toId===state.userId&&r.status==='pending'?`<button class="btn primary" data-request="${r.id}" data-response="accepted">Accept</button> <button class="btn" data-request="${r.id}" data-response="declined">Decline</button>`:r.status!=='pending'?`<button class="btn" data-clear-request="${esc(r.id)}">Clear</button>`:''}</div></div>`}).join('')||'<div class="empty">No collaboration requests.</div>'}</div>`}
function drawNotifications(c){let list=combinedNotifications().filter(n=>n.toId===state.userId&&!n.read);let invites=state.requests.filter(r=>r.toId===state.userId&&r.status==='pending');c.innerHTML=`<div class="row"><h2>Activity updates</h2><button class="btn" id="markAll">Mark all read</button></div><div style="margin-top:16px">${invites.map(r=>`<div class="notif unread"><strong>🤝 Collaboration invitation</strong><p>${esc(name(r.fromId))} invited you to collaborate. Open Requests to accept or decline.</p><button class="btn" data-goto-requests="1">View requests</button></div>`).join('')}${list.map(n=>`<div class="notif ${n.read?'':'unread'}"><strong>${n.text.toLowerCase().includes('deleted')?'🗑 Task deleted':n.text.toLowerCase().includes('revision')?'↻ Revision requested':'● New notification'}</strong><p>${esc(n.text)}</p><button class="btn" data-read="${n.id}" >Mark read</button></div>`).join('')||'<div class="empty">You are all caught up.</div>'}</div>`}
function drawMembers(c){c.innerHTML=`<div class="row"><h2>People & permissions</h2><span class="hint">Manager-only</span></div><div class="notice">Role changes in Firebase require a trusted server-side role management endpoint. They are disabled in live mode until configured.</div><div class="list">${state.users.map(u=>`<div class="task"><div class="stripe"></div><div><strong>${esc(u.name)}</strong><p>${u.role==='manager'?'👑 Manager':'Team member'}</p></div><button class="btn" data-role="${esc(u.id)}" ${state.firebase||u.id===state.userId||u.role==='manager'&&state.users.filter(x=>x.role==='manager').length===1?'disabled':''}>${u.role==='manager'?'Demote':'Promote'}</button></div>`).join('')}</div>`}
function drawSettings(c){c.innerHTML=`<h2>Workspace settings</h2><div class="setting"><h3>Connection</h3><p>${state.firebase?'Firebase Authentication + Cloud Firestore connected.':'Local interactive preview. Changes reset when you reload. Configure Firebase to enable shared team data.'}</p></div><div class="setting"><h3>Task attachments</h3><p>Disabled by design to keep the app lightweight.</p></div><div class="setting"><h3>v1.3 live limitations</h3><p>Deletion and revision alerts use lightweight task activity records, with no Cloud Functions. Deletion is a soft delete (hidden, retained for audit). Task-assignment alerts and manager role changes remain pending. Activity read state is stored on the task document. Request invitations also appear in the notification center.</p></div><div class="setting"><h3>Permissions</h3><p>Firebase mode requires deployed Firestore security rules and a trusted role-change service. Do not enable open user registration without an invitation/provisioning policy.</p></div>${state.firebase?'<button class="btn" id="signOut" style="margin-top:15px">Sign out</button>':''}`}
function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modalback').classList.remove('hidden')};function closeModal(){$('#modalback').classList.add('hidden')}
function taskForm(){openModal('Create a new task',`<form id="taskForm"><div class="formgrid"><label class="field wide">Task title<input name="title" required maxlength="120" placeholder="e.g. Campaign design"></label><label class="field wide">Description<textarea name="description" maxlength="3000" placeholder="Task details"></textarea></label><label class="field">Start date<input name="start" type="date" value="${now}" required></label><label class="field">Deadline<input name="deadline" type="date" value="${add(now,3)}" required></label><label class="field">Category<select name="category">${['Design','Marketing','Operations','Personal'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field">Priority<select name="priority">${['Low','Medium','High','Urgent'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field wide">Assign to<select name="ownerId">${(manager()?state.users:[me()]).map(u=>`<option value="${esc(u.id)}">${esc(u.name)}</option>`).join('')}</select></label></div><div class="footer"><button class="btn" type="button" id="cancelForm">Cancel</button><button class="btn primary">Create task</button></div></form>`)}
function taskDetails(id){let t=state.tasks.find(x=>x.id===id);if(!t||t.deletedAt||!visible(t))return;let canEdit=manager()||t.ownerId===state.userId||t.createdBy===state.userId||t.collaborators.includes(state.userId);openModal(t.title,`<p class="hint">${esc(t.description||'No description')}</p><div class="formgrid"><div class="setting"><strong>Start</strong><p>${fmt(t.start)}</p></div><div class="setting"><strong>Deadline</strong><p>${fmt(t.deadline)}</p></div><div class="setting"><strong>Owner</strong><p>${esc(name(t.ownerId))}</p></div><div class="setting"><strong>Priority</strong><p>${esc(t.priority)}</p></div></div><p class="hint">Collaborators: ${t.collaborators.map(name).map(esc).join(', ')||'None'}</p>${canEdit?`<label class="field">Task status<select id="statusChange">${['Pending','In Progress','On Hold','For Approval','Completed'].filter(s=>s!=='Completed'||manager()).map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></label><button class="btn primary" data-save-status="${esc(t.id)}">Save status</button>`:''}${manager()&&t.status==='For Approval'?` <button class="btn" data-revision="${esc(t.id)}">Request revision</button>`:''}${(manager()||t.ownerId===state.userId)?` <button class="btn danger" data-delete-task="${esc(t.id)}">Delete task</button>`:''}<hr style="border:0;border-top:1px solid #eee;margin:20px 0"><button class="btn purple" data-task-chat="${esc(t.id)}">💬 Open task chat</button><label class="field">Invite a teammate<select id="inviteUser"><option value="">Choose teammate</option>${state.users.filter(u=>u.id!==state.userId&&u.id!==t.ownerId&&!t.collaborators.includes(u.id)).map(u=>`<option value="${esc(u.id)}">${esc(u.name)}</option>`).join('')}</select></label><button class="btn purple" data-invite="${esc(t.id)}">Send collaboration request</button>`)}
async function awaitClear(ids){try{for(const id of ids){let r=state.requests.find(x=>x.id===id);if(!r||r.status==='pending'||!(r.fromId===state.userId||r.toId===state.userId))continue;if(state.firebase)await api.updateDoc(api.doc(db,'requests',id),{clearedBy:api.arrayUnion(state.userId)});else r.clearedBy=[...new Set([...(r.clearedBy||[]),state.userId])]}render();toast('Resolved invitations cleared')}catch(e){toast('Clear failed: '+e.message)}}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(!b)return;if(!manager()&&['team','approvals','members'].includes(b.dataset.page))return;state.page=b.dataset.page;render()});$('#userSwitch').addEventListener('change',e=>{if(state.firebase)return;state.userId=e.target.value;if(!manager()&&['team','approvals','members'].includes(state.page))state.page='calendar';render()});$('#todayBtn').onclick=()=>{state.date=new Date(today.getFullYear(),today.getMonth(),1);render()};$('#prevBtn').onclick=()=>{state.date=new Date(state.date.getFullYear(),state.date.getMonth()-(state.view==='Month'?1:0),state.view==='Month'?1:Math.max(1,state.date.getDate()-(state.view==='Week'?7:1)));render()};$('#nextBtn').onclick=()=>{state.date=new Date(state.date.getFullYear(),state.date.getMonth()+(state.view==='Month'?1:0),state.view==='Month'?1:state.date.getDate()+(state.view==='Week'?7:1));render()};$('#bellBtn').onclick=()=>{state.page='notifications';render()};$('#newBtn').onclick=taskForm;$('#closeModal').onclick=closeModal;$('#modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});
$('#content').addEventListener('change',e=>{if(e.target.id==='calendarFilter'){state.calendarFilter=e.target.value;render()}});$('#content').addEventListener('submit',e=>{if(e.target.id==='chatSend'){e.preventDefault();sendChat()}else if(e.target.id==='leaveForm'){e.preventDefault();saveLeave(e.target)}});$('#content').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.id==='startDirect'){startChat('direct')}else if(b.id==='startGroup'){startChat('group')}else if(b.dataset.leaveView){state.page='leave';render();return}else if(b.dataset.chatOpen){openChat(b.dataset.chatOpen);return}else if(b.dataset.leaveDecision){decideLeave(b.dataset.leaveDecision,b.dataset.decision);return}else if(b.dataset.leaveView){state.page='leave';render();return}else if(b.dataset.leaveCancel){cancelLeave(b.dataset.leaveCancel);return}else if(b.dataset.gotoRequests){state.page='requests';render()}else if(b.dataset.view){state.view=b.dataset.view;render()}else if(b.dataset.task)taskDetails(b.dataset.task);else if(b.dataset.clearRequest){awaitClear([b.dataset.clearRequest]);return}else if(b.id==='clearAllRequests'){awaitClear(state.requests.filter(r=>r.status!=='pending'&&(r.toId===state.userId||r.fromId===state.userId)).map(r=>r.id));return}else if(b.dataset.request){let r=state.requests.find(x=>x.id===b.dataset.request);if(!r||r.toId!==state.userId||r.status!=='pending')return;if(state.firebase){const status=b.dataset.response;const rr=api.doc(db,'requests',r.id),tr=api.doc(db,'tasks',r.taskId);const action=status==='declined'?api.updateDoc(rr,{status:'declined'}):api.runTransaction(db,async tx=>{const rs=await tx.get(rr);if(!rs.exists()||rs.data().toId!==state.userId||rs.data().status!=='pending')throw Error('Invitation is no longer pending');tx.update(tr,{collaborators:api.arrayUnion(state.userId),lastCollabRequestId:r.id});tx.update(rr,{status:'accepted'})});action.then(()=>toast('Request '+status)).catch(e=>{console.error('Collaboration '+status,e);toast('Request failed ('+status+'): '+e.message)});return}r.status=b.dataset.response;if(r.status==='accepted'){let t=state.tasks.find(x=>x.id===r.taskId);if(t&&!t.collaborators.includes(state.userId)){t.collaborators.push(state.userId);updateTask(t)}}notify(r.fromId,`${name(state.userId)} ${r.status} your collaboration request`);render();toast('Request '+r.status)}else if(b.dataset.read){let n=state.notifications.find(x=>x.id===b.dataset.read);if(n&&n.toId===state.userId){n.read=true;if(state.firebase){api.updateDoc(api.doc(db,'notifications',n.id),{read:true}).catch(e=>toast('Mark read failed: '+e.message))}render()}else{let a=liveActivity().find(x=>x.id===b.dataset.read);if(a&&state.firebase)api.updateDoc(api.doc(db,'tasks',a.taskId),{activityReadBy:api.arrayUnion(state.userId)}).catch(e=>toast('Mark read failed: '+e.message))}}else if(b.id==='markAll'){liveActivity().filter(n=>!n.read).forEach(n=>{if(state.firebase)api.updateDoc(api.doc(db,'tasks',n.taskId),{activityReadBy:api.arrayUnion(state.userId)}).catch(e=>toast('Mark read failed: '+e.message))});state.notifications.filter(n=>n.toId===state.userId&&!n.read).forEach(n=>{n.read=true;if(state.firebase){api.updateDoc(api.doc(db,'notifications',n.id),{read:true}).catch(e=>toast('Mark read failed: '+e.message))}});render()}else if(b.dataset.role){if(state.firebase)return;let u=state.users.find(x=>x.id===b.dataset.role);if(!manager()||!u||u.id===state.userId)return;if(u.role==='manager'&&state.users.filter(x=>x.role==='manager').length<2)return;u.role=u.role==='manager'?'member':'manager';notify(u.id,`Your role has changed to ${u.role}`);render()}else if(b.id==='signOut'&&auth)api.signOut(auth)});
$('#modalBody').addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;if(b.id==='createChat'){await createChat(b.dataset.chatType);return}if(b.dataset.taskChat){let task=state.tasks.find(x=>x.id===b.dataset.taskChat);if(task)await openTaskChat(task);return}if(b.dataset.deleteTask){let t=state.tasks.find(x=>x.id===b.dataset.deleteTask);if(!t||!(manager()||t.ownerId===state.userId))return;if(!confirm('Permanently delete '+t.title+'? Everyone involved will be notified.'))return;try{if(state.firebase){await api.updateDoc(api.doc(db,'tasks',t.id),{deletedAt:api.serverTimestamp(),activityEvent:{id:crypto.randomUUID(),type:'deleted',by:state.userId,text:`${t.title} was deleted by ${name(state.userId)} (${manager()?'Manager':'Task owner'})`},activityReadBy:[state.userId]})}else{let recipients=new Set([t.ownerId,...t.collaborators]);if(manager()&&t.ownerId!==state.userId)recipients.add(t.ownerId);state.users.filter(u=>u.role==='manager').forEach(u=>recipients.add(u.id));recipients.delete(state.userId);recipients.forEach(uid=>notify(uid,`${t.title} was deleted by ${name(state.userId)} (${manager()?'Manager':'Task owner'})`));state.tasks=state.tasks.filter(x=>x.id!==t.id)}closeModal();render();toast('Task deleted')}catch(err){toast('Delete failed: '+err.message)}return}if(b.dataset.revision){let t=state.tasks.find(x=>x.id===b.dataset.revision);if(!t||!manager()||t.status!=='For Approval')return;openModal('Request revision',`<p class="hint">${esc(t.title)}</p><label class="field">Revision notes<textarea id="revisionNotes" maxlength="2000" placeholder="Explain what needs changing" required></textarea></label><div class="footer"><button class="btn" id="cancelForm">Cancel</button><button class="btn primary" data-submit-revision="${esc(t.id)}">Send revision request</button></div>`);return}if(b.dataset.submitRevision){let t=state.tasks.find(x=>x.id===b.dataset.submitRevision),notes=$('#revisionNotes')?.value.trim();if(!t||!notes)return toast('Enter revision notes');try{if(state.firebase){await api.updateDoc(api.doc(db,'tasks',t.id),{status:'In Progress',activityEvent:{id:crypto.randomUUID(),type:'revision',by:state.userId,text:`${name(state.userId)} requested revisions for ${t.title}: ${notes}`},activityReadBy:[state.userId]})}else{t.status='In Progress';new Set([t.ownerId,...t.collaborators]).forEach(uid=>{if(uid!==state.userId)notify(uid,`${name(state.userId)} requested revisions for ${t.title}: ${notes}`)})}closeModal();render();toast('Revision requested')}catch(err){toast('Revision failed: '+err.message)}return}if(b.id==='cancelForm'){closeModal();return}if(b.dataset.saveStatus){let t=state.tasks.find(x=>x.id===(b.dataset.saveStatus));if(!t)return;let status=$('#statusChange').value;if(status==='Completed'&&!manager())return;if(t.status!==status){t.status=status;updateTask(t);if(status==='For Approval')state.users.filter(u=>u.role==='manager').forEach(u=>notify(u.id,`${name(state.userId)} submitted ${t.title} for approval`));if(b.dataset.revision)notify(t.ownerId,`Revision requested for ${t.title}`);if(status==='Completed')notify(t.ownerId,`${t.title} was approved`)}closeModal();toast('Task updated')}else if(b.dataset.invite){let to=$('#inviteUser').value,t=state.tasks.find(x=>x.id===b.dataset.invite);if(!to||!t)return;if(state.requests.some(r=>r.taskId===t.id&&r.toId===to&&r.status==='pending'))return toast('Invitation already pending');let r={id:crypto.randomUUID(),taskId:t.id,fromId:state.userId,toId:to,status:'pending'};state.requests.push(r);persist('requests',r);notify(to,`${name(state.userId)} invited you to collaborate on ${t.title}`);closeModal();render();toast('Invitation sent')}});
$('#modalBody').addEventListener('submit',e=>{if(e.target.id!=='taskForm')return;e.preventDefault();let f=new FormData(e.target),start=f.get('start'),deadline=f.get('deadline');if(deadline<start)return toast('Deadline must be after the start date');let ownerId=f.get('ownerId');if(!manager()&&ownerId!==state.userId)return;let t={id:crypto.randomUUID(),title:String(f.get('title')).trim(),description:String(f.get('description')).trim(),start,deadline,category:f.get('category'),priority:f.get('priority'),ownerId,createdBy:state.userId,status:'Pending',collaborators:[]};if(!t.title)return;updateTask(t);if(ownerId!==state.userId)notify(ownerId,`${name(state.userId)} assigned you: ${t.title}`);closeModal();toast('Task created')});
render();initFirebase();
</script></body></html>
